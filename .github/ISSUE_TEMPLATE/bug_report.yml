name: Bug report / Помилка
description: Something does not work as expected / Щось працює не так, як очікується
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check for an [existing issue](https://github.com/llmdevstudio/yarmarka-apps/issues) first. You can write in English or Ukrainian.
        Дякуємо, що повідомляєте про проблему! Перевірте, будь ласка, чи немає вже [схожого issue](https://github.com/llmdevstudio/yarmarka-apps/issues). Можна писати українською.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / Що сталося?
      description: Describe the problem. / Опишіть проблему коротко й конкретно.
      placeholder: The app closes after tapping "Compare".
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Кроки для відтворення
      placeholder: |
        1. Open "Browse"
        2. Select two apps
        3. Tap "Compare"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Що мало статися?
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App version / Версія застосунку
      description: Settings → About / Налаштування → Про застосунок
      placeholder: "1.0 (3)"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Installed from / Звідки встановлено?
      options:
        - Google Play
        - APK from GitHub / APK з GitHub
        - Other / Інше
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version / Пристрій і версія Android
      placeholder: "Samsung Galaxy A54, Android 14"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often? / Як часто?
      options:
        - Always / Завжди
        - Sometimes / Іноді
        - Once / Один раз
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video / Скриншоти або відео
      description: Drag files here. Do not include personal data. / Перетягніть файли сюди. Не додавайте особисті дані.
    validations:
      required: false
