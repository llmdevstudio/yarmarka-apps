name: Feature request / Ідея
description: Suggest a feature or improvement / Запропонувати нову можливість або покращення
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? / Яку задачу це вирішує?
      placeholder: I want to quickly see which apps were updated since I last checked.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How could it work? / Як це могло б працювати?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / Як ви робите це зараз?
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App version / Версія застосунку
      placeholder: "1.0 (3)"
    validations:
      required: false
